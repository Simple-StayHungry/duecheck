<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>DueCheck · 尽调核查</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header class="topbar"><button class="brand" id="homeBtn" aria-label="回到任务首页"><span class="brandmark">D</span><span>DueCheck<small>尽调核查</small></span></button><div class="topactions" id="taskActions" hidden><button id="settingsBtn" class="textbtn">设置</button><button id="exportBtn" class="primary">导出 Word</button></div></header>
<main id="homeView" class="home">
  <div class="intro"><div class="eyebrow">文档与证据，一一对应</div><h1>开始一次核查。</h1><p>导入原稿，确认疑点，补图后导出。</p></div>
  <div id="dropZone" class="dropzone" role="button" tabindex="0" aria-label="上传 Word 或 ZIP"><span class="dropglyph" aria-hidden="true">＋</span><h2>拖入 Word 或 ZIP</h2><p>支持多家公司一起处理</p><button id="chooseBtn" class="primary" type="button">选择文件</button><input id="docInput" type="file" accept=".docx,.zip" multiple hidden></div>
  <section id="recentSection" class="recent" hidden><div class="sectionlabel">最近</div><div id="recentList"></div></section>
  <div class="localnote">文件在本机处理，不上传至外部服务。</div>
</main>
<main id="workView" class="workspace" hidden>
  <aside class="sidebar"><div class="side-label">公司</div><nav id="companyList" aria-label="公司选择"></nav><button id="bulkBtn" class="secondary full">批量补图</button><input id="bulkInput" type="file" accept="image/*" multiple hidden><button id="inboxBtn" class="textbtn inboxbutton" hidden></button><div id="saveLabel" class="save-note">自动保存</div></aside>
  <section class="workmain"><div class="companyheading"><div><div id="companyMeta" class="eyebrow"></div><h1 id="companyTitle"></h1></div><button id="copyCompany" class="textbtn copybtn" title="复制公司名称">复制名称</button></div>
  <div id="scanNotice" class="scan-notice" role="status"></div>
  <div class="toolbar"><div class="tabs" role="tablist"><button class="tab active" data-tab="needs" role="tab" aria-selected="true">待处理</button><button class="tab" data-tab="unread" role="tab">待看图</button><button class="tab" data-tab="all" role="tab">全部</button></div><input id="searchInput" type="search" placeholder="查找网站" aria-label="查找网站"></div>
  <div id="siteList" class="sitelist"></div>
  <div id="emptyState" class="empty-state" hidden><span class="empty-line"></span><h2>这一组已经处理完。</h2><p>继续查看其他项目，或导出 Word。</p></div>
  <div class="company-export-row"><button id="exportCurrentBtn" class="primary current-export">导出当前公司</button></div>
  <div id="resultArea" hidden></div>
  </section>
</main>
<dialog id="itemDialog" class="itemdialog"><div class="dialoghead"><div class="dialogtitle"><small id="itemCompany"></small><h2 id="itemTitle"></h2></div><button class="closebtn" data-close="itemDialog" aria-label="关闭">×</button></div>
<div class="item-body"><section class="imagecol"><div class="imagetop"><div class="tabs smalltabs"><button id="oldTab" class="tab active">原截图</button><button id="newTab" class="tab" hidden>新截图</button></div><div class="imagearrows"><button id="prevImage" class="textbtn" aria-label="上一张截图">←</button><span id="imageCounter"></span><button id="nextImage" class="textbtn" aria-label="下一张截图">→</button></div></div><div id="imageStage" class="image-stage"><img id="currentImage" alt="核查截图，点击查看大图" hidden><div id="diagOverlay" class="diag-overlay" hidden></div><div id="noImage" class="noimage">暂无截图<br><span>可拖入图片或粘贴截图</span></div></div><div id="imageNote" class="image-note"></div><div id="imageThumbs" class="imagethumbs"></div></section>
<section class="detailcol"><a id="siteLink" target="_blank" rel="noopener noreferrer" class="site-link">打开查询网站 <span aria-hidden="true">↗</span></a><div id="triadInfo" class="triad" aria-label="截图三要素"></div><details id="evidenceDetails" class="evidence-details"><summary>查看本张判定依据</summary><div id="evidenceText"></div></details><details id="diagDetails" class="evidence-details diag-details"><summary>定位与识别诊断</summary><div id="diagBody"></div></details>
<div id="documentIssues" class="document-issues"></div><form id="itemForm"><div class="formtitle">同步到 Word</div><label>核查日期<input type="date" id="itemDate"></label><label>查询状态<select id="itemSuccess"><option value="是">是</option><option value="查询失败">查询失败</option><option value="">留空</option></select></label><label>核查结论<textarea id="itemConclusion" rows="3" placeholder="没有明确结论，可以留空"></textarea></label><p class="field-note">采用截图不等于认定无异常。</p><label class="checklabel manual-confirm" id="triadConfirmLabel"><input type="checkbox" id="confirmTriad"><span id="triadConfirmText">我已逐张核对将采用截图的公司、时间和结果</span></label><label class="checklabel manual-confirm" id="anomalyConfirmLabel" hidden><input type="checkbox" id="confirmAnomaly"><span>已核实原批注提示的异常，并填写结论</span></label></form></section></div>
<div class="dialogfoot"><div class="footleft"><button id="excludeBtn" class="textbtn subtle">本次不适用</button><button id="undoBtn" class="textbtn" hidden>撤销处理</button></div><div class="footright"><button id="pickImageBtn" class="secondary">补充截图</button><input id="itemImageInput" type="file" accept="image/*" multiple hidden><button id="saveItemBtn" class="primary">确认保留</button></div></div></dialog>
<dialog id="zoomDialog" class="zoomdialog"><button class="closebtn zoomclose" data-close="zoomDialog" aria-label="关闭大图">×</button><img id="zoomImage" alt="截图原图"></dialog>
<dialog id="settingsDialog" class="smalldialog"><div class="dialoghead"><h2>设置</h2><button class="closebtn" data-close="settingsDialog" aria-label="关闭">×</button></div><div class="settingsbody"><label>补图日期<input type="date" id="taskDate"></label><div class="extra-sites"><div class="formtitle compact-title">新增网站</div><div id="extraSitesList"></div><div class="extra-site-add"><input id="extraSiteName" type="text" placeholder="网站名称" aria-label="新增网站名称"><input id="extraSiteUrl" type="url" placeholder="https://…" aria-label="新增网站网址"><button id="addExtraSite" class="secondary" type="button">添加</button></div></div></div><div class="dialogfoot"><span></span><button id="saveSettings" class="primary">保存</button></div></dialog>
<dialog id="inboxDialog" class="inboxdialog"><div class="dialoghead"><div><small>批量补图</small><h2>确认截图归属</h2></div><button class="closebtn" data-close="inboxDialog" aria-label="关闭">×</button></div><div class="inboxbody"><div class="field-note">只使用已确认的对应关系。同一项目的多张图片将一起替换。</div><div id="inboxList"></div></div><div class="dialogfoot"><span id="inboxCount" class="field-note"></span><button id="saveInbox" class="primary">确认归位</button></div></dialog>
<dialog id="exportDialog" class="smalldialog"><div class="dialoghead"><h2>导出前确认</h2><button class="closebtn" data-close="exportDialog" aria-label="关闭">×</button></div><div class="settingsbody"><p id="exportMessage"></p><div id="exportPending"></div><button id="confirmOthersBtn" class="secondary full" hidden>未提示问题的原图，我已人工核对</button></div><div class="dialogfoot"><button class="textbtn" data-close="exportDialog">返回处理</button><button id="draftBtn" class="secondary">导出待核版</button></div></dialog>
<div id="busy" class="busy" hidden role="status"><div class="busycard"><span class="spinner"></span><span id="busyText">正在处理</span></div></div><div id="toast" class="toast" role="status"></div><script src="/static/app.js"></script>
</body></html>
